; FFXI Agent Lab private-server profile.
; Copy to C:\Ashita\config\boot\agentlab.ini.

[ashita.launcher]
autoclose = 1
name = FFXI Agent Lab

[ashita.boot]
file = C:\FFXI-Lab\xiloader.exe
command = --server 10.211.55.2
gamemodule = ffximain.dll
script = agentlab.txt
args =

[ashita.input]
gamepad.allowbackground = 0
gamepad.disableenumeration = 0
keyboard.blockinput = 0
keyboard.blockbindsduringinput = 1
keyboard.silentbinds = 0
keyboard.windowskeyenabled = 0
mouse.blockinput = 0
mouse.unhook = 1

[ashita.language]
playonline = 2
ashita = 2

[ashita.logging]
level = 5
crashdumps = 1

[ashita.misc]
addons.silent = 0
aliases.silent = 0
plugins.silent = 0

[ashita.polplugins]
sandbox = 0

[ashita.resources]
offsets.use_overrides = 1
pointers.use_overrides = 1
resources.use_overrides = 1

[ashita.taskpool]
threadcount = -1

[ashita.window.startpos]
x = -1
y = -1

[ffxi.registry]
# Keep the stable 2560x1440 borderless presentation, but render the 3D
# background at 2048x1152. Native 2560x1440 background rendering was unstable
# in the tested Windows 11 ARM / Parallels client.
0000 = 6
0001 = 2560
0002 = 1440
0003 = 2048
0004 = 1152
0018 = 2
0019 = 1
0036 = 2
0037 = 2304
0038 = 1296
